name: Example Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      OPENCLAW_LOG_LEVEL: debug
      OPENCLAW_PLUGIN_LIFECYCLE_TRACE: '1'
    strategy:
      fail-fast: false
      matrix:
        example:
          - workspace
          - install
          - setup
          - shared
          - backup
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Add local tools to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Set up OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
        with:
          agent-system: github:tanaabased/openclaw-agent-system#0a24fc5ae316839471a1237c42cbe42d320cd03c
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Refresh Homebrew when needed
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Run Leia-backed example
        shell: bash
        env:
          NO_COLOR: '1'
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SMUTLORDKEY }}
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
        run: |
          mkdir -p "$TMPDIR"
          # Preserve the action-installed OpenClaw's position on PATH.
          leia "examples/${{ matrix.example }}/README.md" --retry 0
      - name: RUNNING A LEVEL THREE DIAGNOSTICS
        if: failure()
        shell: bash
        run: |
          if [[ -d "${OPENCLAW_WORKSPACE:-}" ]]; then
            openclaw-diagnostics
          else
            echo "No OpenClaw workspace was created; see the scenario failure output above."
          fi
