schema-version: 1

agent:
  id: smutlord
  name: smutlord
  runtime: codex
  email:
    from-environment: EMAIL
  description: Hair-metal agent for bounded Bugs, Tasks, and Features.
  avatar: assets/icon-large.png
  emoji: 💀🔥

setup-host:
  file: ./setup-host.yaml

setup-agent:
  file: ./setup-agent.yaml

environment:
  op: 3t5psl4lnq2vqfvub3u6pq4tdm
  set:
    SMUTLORD_SSH_KEY:
      from-op: 'op://gwhijlujd334yr67wonpmsrr2y/id_smutkey/private key?ssh-format=openssh'
  required:
    - EMAIL
    - GH_TOKEN
    - SMUTLORD_SSH_KEY
    - SMUT_RECALL_KEY
    - GOG_ACCOUNT
    - GOG_CREDENTIALS_JSON
    - GOG_TOKEN_JSON
    - GOG_KEYRING_PASSWORD

models:
  default:
    model: openai/gpt-6.1-sol
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6.1-sol
    effort: high

memory:
  search:
    provider: openai
    model: text-embedding-3-small
    api-key: SMUT_RECALL_KEY

google:
  account:
    from-environment: GOG_ACCOUNT
  credential-encoding: base64
  oauth-client: GOG_CREDENTIALS_JSON
  oauth-token: GOG_TOKEN_JSON
  keyring-password: GOG_KEYRING_PASSWORD

git:
  worktrees: {}
  ssh:
    private-keys:
      from-environment: SMUTLORD_SSH_KEY
  signing:
    key: SMUTLORD_SSH_KEY
    allowed-signers-file: .agent-system/allowed_signers
  policy:
    delete-remote-ref: deny
    force-push: deny

github:
  host: github.com
  username: smutlord
  token: GH_TOKEN
  ssh-keys:
    key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDfCqPM+EQzOSBzbktgt3zwRjttQPAosS27kZbdN4mHT'
    title: smutlord-authentication
  ssh-signing-keys:
    key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDfCqPM+EQzOSBzbktgt3zwRjttQPAosS27kZbdN4mHT'
    title: smutlord-signing
  config:
    git-protocol: ssh
    spinner: disabled
    telemetry: disabled
  schema-version: 3
  runtimes:
    - openclaw
  allowed-repository-owners:
    - O_kgDODNGy1g
    - MDQ6VXNlcjcxMzQyNA==
    - MDEyOk9yZ2FuaXphdGlvbjMxNjA1NTg0
  issue-assignment:
    allowed:
      - MDQ6VXNlcjcxMzQyNA==
      - U_kgDOEUqvpg
      - MDQ6VXNlcjMxNTk5ODk0
      - U_kgDODUXqww
    reviewers:
      - MDQ6VXNlcjcxMzQyNA==
  policy:
    releases: deny

backup:
  output: .agent-system/backups
  git-ignore: true
  openclaw-state: required
  include:
    - '{MEMORY,DREAMS,BOOTSTRAP}.md'
    - memory/**
    - .private/**

automations:
  - id: backup-drive-nightly
    enabled: true
    runtimes:
      - openclaw
    schedule:
      cron: '0 3 * * *'
      timezone: America/New_York
    run:
      - bun
      - scripts/backup-drive-task.js
    timeout-seconds: 3600
