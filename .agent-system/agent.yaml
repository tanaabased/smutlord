schema-version: 1

agent:
  id: smutlord
  name: smutlord
  runtime: codex
  email:
    from-environment: EMAIL
  description: Hair-metal agent for bounded Bugs, Tasks, and Features.
  avatar: assets/icon-large.png
  emoji: 💀🔥

models:
  default:
    model: openai/gpt-6.1-sol
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6.1-sol
    effort: high

memory:
  search:
    provider: openai
    model: text-embedding-3-small
    api-key: SMUT_RECALL_KEY

backup:
  output: .agent-system/backups
  git-ignore: true
  openclaw-state: required
  include:
    - '{MEMORY,DREAMS,BOOTSTRAP}.md'
    - memory/**
    - .private/**

environment:
  op: 3t5psl4lnq2vqfvub3u6pq4tdm
  set:
    SMUTLORD_SSH_KEY:
      from-op: 'op://gwhijlujd334yr67wonpmsrr2y/id_smutkey/private key?ssh-format=openssh'
  required:
    - EMAIL
    - GH_TOKEN
    - SMUTLORD_SSH_KEY
    - SMUT_RECALL_KEY

git:
  worktrees: {}
  ssh:
    private-keys:
      from-environment: SMUTLORD_SSH_KEY
  signing:
    key: SMUTLORD_SSH_KEY
    allowed-signers-file: .agent-system/allowed_signers
  policy:
    delete-remote-ref: deny
    force-push: deny

github:
  host: github.com
  username: smutlord
  token: GH_TOKEN
  ssh-keys:
    key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDfCqPM+EQzOSBzbktgt3zwRjttQPAosS27kZbdN4mHT'
    title: smutlord-authentication
  ssh-signing-keys:
    key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDfCqPM+EQzOSBzbktgt3zwRjttQPAosS27kZbdN4mHT'
    title: smutlord-signing
  config:
    git-protocol: ssh
    spinner: disabled
    telemetry: disabled
  notifications:
    assignment-types:
      - issue
    interval-minutes: 5
    approved-actors:
      - login: pirog
        node-id: MDQ6VXNlcjcxMzQyNA==
        operator-owner: true
      - login: emoriwan
        node-id: U_kgDOEUqvpg
      - login: smutlord
        node-id: MDQ6VXNlcjMxNTk5ODk0
    allowed-repository-owners:
      - login: tanaabased
        node-id: O_kgDODNGy1g
      - login: pirog
        node-id: MDQ6VXNlcjcxMzQyNA==
      - login: lando
        node-id: MDEyOk9yZ2FuaXphdGlvbjMxNjA1NTg0
    pull-request:
      reviewers:
        - login: pirog
          node-id: MDQ6VXNlcjcxMzQyNA==
  policy:
