defaults: &defaults
  runtimes: [openclaw]
  group: REPORTS
  model: low

updates: &updates
  <<: *defaults
  thread:
    id: updates
    name: AGENT UPDATE

automations:
  - <<: *updates
    id: update-agent
    display-name: '⬇️ UPDATE AGENT'
    schedule: '30 23 * * *'
    timeout-seconds: 3600
    run:
      - bash
      - scripts/update-agent.sh

  - <<: *updates
    id: backup-agent
    display-name: '💾 BACKUP AGENT'
    schedule: '0 1 * * *'
    run:
      - bash
      - scripts/backup-drive-task.sh

  - <<: *defaults
    id: russian-roulette
    display-name: '🔫 RUSSIAN ROULETTE'
    model: default
    thread: RUSSIAN ROULETTE
    schedule: '0 10 * * 0'
    prompt:
      file: ../prompts/review-russian-palette.md
